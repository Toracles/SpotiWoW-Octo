name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow psutil "syncedlyrics==1.0.1"

      - name: Build hidden-console runtime launcher
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name SpotiWoW-Octo
          --icon companion/SpotiWoW-Octo.ico
          --collect-all syncedlyrics --collect-all pystray
          --collect-all psutil --collect-all PIL
          --distpath dist --workpath build/launcher --specpath build/launcher
          companion/SpotiWoW-OctoLauncher.py

      - name: Assemble French and US portable runtime bundles
        shell: pwsh
        run: |
          $root = $PWD
          $variants = @(
            @{ Code = "FR"; Readme = "README_FR.txt"; AddonSource = "Interface/AddOns/SpotiWoW-Octo" },
            @{ Code = "US"; Readme = "README_EN_US.txt"; AddonSource = "Interface/AddOns/SpotiWoW-Octo" }
          )
          foreach ($variant in $variants) {
            $stage = Join-Path $root ("release-stage-" + $variant.Code)
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $stage "Interface/AddOns") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $stage "companion") | Out-Null
            $addonDest = Join-Path $stage "Interface/AddOns/SpotiWoW-Octo"
            New-Item -ItemType Directory -Force -Path $addonDest | Out-Null
            Copy-Item -Recurse (Join-Path $variant.AddonSource "*") $addonDest -Force
            if ($variant.Code -eq "US") {
              Copy-Item "variants/US/SpotiWoW-Octo_Locale.lua" (Join-Path $addonDest "SpotiWoW-Octo_Locale.lua") -Force
              Copy-Item "variants/US/SpotiWoW-Octo.toc" (Join-Path $addonDest "SpotiWoW-Octo.toc") -Force
            }
            Copy-Item "dist/SpotiWoW-Octo.exe" (Join-Path $stage "companion/SpotiWoW-Octo.exe")
            Copy-Item "companion/spotify_bridge.py" (Join-Path $stage "companion/spotify_bridge.py")
            Copy-Item "companion/config.example.json" (Join-Path $stage "companion/config.example.json")
            $configExamplePath = Join-Path $stage "companion/config.example.json"
            $configExample = Get-Content $configExamplePath -Raw | ConvertFrom-Json
            $configExample.language = if ($variant.Code -eq "US") { "us" } else { "fr" }
            $configExample | ConvertTo-Json -Depth 8 | Set-Content -Path $configExamplePath -Encoding utf8
            Copy-Item "companion/SpotiWoW-Octo.ico" (Join-Path $stage "companion/SpotiWoW-Octo.ico")
            Copy-Item "companion/SpotiWoW-Octo.png" (Join-Path $stage "companion/SpotiWoW-Octo.png")
            Copy-Item "companion/THIRD_PARTY_NOTICES.txt" (Join-Path $stage "companion/THIRD_PARTY_NOTICES.txt")
            Copy-Item $variant.Readme (Join-Path $stage $variant.Readme)
            $out = Join-Path $root ("dist/SpotiWoW-Octo-Portable-" + $variant.Code + ".zip")
            if (Test-Path $out) { Remove-Item $out -Force }
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $out -CompressionLevel Optimal

            # Also publish an add-on-only archive for players who already installed the companion.
            $addonStage = Join-Path $root ("addon-stage-" + $variant.Code)
            $addonStageParent = Join-Path $addonStage "Interface/AddOns"
            New-Item -ItemType Directory -Force -Path $addonStageParent | Out-Null
            Copy-Item -Recurse (Join-Path $stage "Interface/AddOns/SpotiWoW-Octo") $addonStageParent -Force
            $addonOut = Join-Path $root ("dist/SpotiWoW-Octo-Addon-" + $variant.Code + ".zip")
            if (Test-Path $addonOut) { Remove-Item $addonOut -Force }
            Compress-Archive -Path (Join-Path $addonStage "*") -DestinationPath $addonOut -CompressionLevel Optimal
          }

      - name: Build the beginner-friendly setup EXE
        shell: pwsh
        run: |
          Set-Content -Path "installer/repo.txt" -Value "${{ github.repository }}" -NoNewline
          python -m PyInstaller --clean --noconfirm --onefile --windowed `
            --name SpotiWoW-Octo-Setup `
            --icon installer/SpotiWoW-Octo.ico `
            --add-data "installer/repo.txt;." `
            --add-data "installer/SpotiWoW-Octo.ico;." `
            --distpath dist --workpath build/setup --specpath build/setup `
            installer/SpotiWoW-OctoSetup.py

      - name: Attach installer, portable packages, and add-on-only zips to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SpotiWoW-Octo-Setup.exe
            dist/SpotiWoW-Octo-Portable-FR.zip
            dist/SpotiWoW-Octo-Portable-US.zip
            dist/SpotiWoW-Octo-Addon-FR.zip
            dist/SpotiWoW-Octo-Addon-US.zip
